claim:
  identity:
    uri: urn:unfurl:foundry:rag
    name: foundry-substrate-rag
    kind: INTELLIGENT_COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Retrieval-augmented generation substrate for Foundry intelligent components.
    concerns:
      - concern: rag.search
        description: Vector / hybrid retrieval over an indexed corpus.
      - concern: rag.embed
        description: Embed query and document text for retrieval.
    boundary_principles:
      - In-process library; no network egress unless provider bindings are configured.
      - Corpus configuration is host-bound; no design-time index is shipped in the JAR.
      - Vector and embedding dependencies are neutral DCP ports that may be satisfied by any provider adapter.
  refusals:
    - concern: rag.corpus-backend
      rationale: RAG does not own the corpus, vector store, or embedding provider; those are supplied by host bindings or provider adapter claims selected at deployment time.
      owned_by: urn:unfurl:foundry:provider-adapter
  dependencies:
    needs:
      - "rag.corpus@v1?owner=host"
      - "vector-store@v1?transport=profile-binding&shape=com.unfurl.foundry.substrate.ports.VectorStore"
      - "embedding-provider@v1?transport=profile-binding&shape=com.unfurl.foundry.substrate.ports.EmbeddingProvider"
  offers:
    - capability: rag.search
      description: Retrieve passages relevant to a query from a configured corpus.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: EVOLVING
      version: 0.1.0
      metered: false
    - capability: rag.embed
      description: Compute embeddings for query/document text.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: EVOLVING
      version: 0.1.0
      metered: false
  negotiation_surface:
    endpoint: in-process:foundry-substrate-rag
    protocols_supported: [IN_PROCESS]
    supported_intents:
      - intent: bind-corpus
        description: Confirm the host-supplied corpus and vector store backend used for retrieval.
      - intent: bind-embedding-provider
        description: Confirm the embedding provider binding used for retrieval and indexing paths.
    answer_grounding:
      - claim.offers
      - claim.dependencies
    limitations:
      - No corpus or index is shipped in the JAR; corpus data is host-bound.
      - No network egress unless a vector store or embedding provider binding is configured.
  faults:
    emitted:
      - code: rag.search.degraded
        category: DEPENDENCY
        severity: DEGRADED
        description: Retrieval could not return the grounded context requested by the agent.
        affects:
          needs: []
          offers:
            - rag.search
          constraints: []
        evidence:
          signals: [INVOCATION_ERROR, METRIC_THRESHOLD]
        propagation:
          parent_impact: DEGRADED
          propagates_when: parent composition depends on retrieved grounding
          suppresses_when: retrieval is optional for the parent agent phase
        remediation:
          allowed_actions: [retry_retrieval, switch_collection, repair_vector_store]
      - code: rag.embed.failed
        category: DEPENDENCY
        severity: BLOCKING
        description: Embedding generation failed for a retrieval or indexing path.
        affects:
          needs:
            - embedding-provider@v1?transport=profile-binding&shape=com.unfurl.foundry.substrate.ports.EmbeddingProvider
          offers:
            - rag.embed
          constraints: []
        evidence:
          signals: [INVOCATION_ERROR, HEALTH]
        propagation:
          parent_impact: BLOCKED
          propagates_when: parent composition requires embeddings to satisfy retrieval
          suppresses_when: precomputed embeddings satisfy the request
        remediation:
          allowed_actions: [retry_embedding, repair_embedding_provider, use_precomputed_vectors]
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:foundry-substrate-rag:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
