claim:
  identity:
    uri: urn:unfurl:foundry:rag
    name: foundry-substrate-rag
    kind: INTELLIGENT_COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Retrieval-augmented generation substrate for Foundry intelligent components.
    concerns:
      - concern: rag.search
        description: Vector / hybrid retrieval over an indexed corpus.
      - concern: rag.embed
        description: Embed query and document text for retrieval.
    boundary_principles:
      - In-process library; no network egress unless an embedding provider is configured.
      - Corpus configuration is host-bound; no design-time index is shipped in the JAR.
  refusals:
    - concern: rag.corpus-backend
      rationale: RAG does not own the vector store or embedding provider; those are host-supplied Spring AI beans selected at deployment time.
      owned_by: urn:host
  dependencies:
    needs:
      # Both deps are host-owned. The corpus is the customer's vector
      # store backend (Chroma / PGVector / Pinecone / etc.) wired
      # through Spring AI's VectorStore abstraction. The embedding
      # client is the customer-configured Spring AI EmbeddingClient bean
      # — provider selection (OpenAI / Azure / Ollama) is a deployment
      # decision, not a fabric-composition decision, so both stay on
      # the host side of the perimeter.
      - "rag.corpus@v1?owner=host"
      - "spring-ai.embedding-client@v1?owner=host"
  offers:
    - capability: rag.search
      description: Retrieve passages relevant to a query from a configured corpus.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: EVOLVING
      version: 0.1.0
      metered: false
    - capability: rag.embed
      description: Compute embeddings for query/document text.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: EVOLVING
      version: 0.1.0
      metered: false
  negotiation_surface:
    endpoint: in-process:foundry-substrate-rag
    protocols_supported: [IN_PROCESS]
    supported_intents:
      - intent: bind-corpus
        description: Confirm the host-supplied vector store backend used for retrieval.
      - intent: bind-embedding-client
        description: Confirm the host-supplied Spring AI embedding client.
    answer_grounding:
      - claim.offers
      - claim.dependencies
    limitations:
      - No corpus or index is shipped in the JAR; both are host-bound.
      - No network egress unless an embedding provider is configured.
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:foundry-substrate-rag:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
