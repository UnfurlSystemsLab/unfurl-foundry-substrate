claim:
  identity:
    uri: urn:unfurl:foundry:sample:tool-using-agent
    name: sample-tool-using-agent
    kind: INTELLIGENT_COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Function-calling sample agent — invokes host-registered tools through Spring AI's tool-callback mechanism in response to user intent.
    concerns:
      - concern: agent.tool-using
        description: Agent that decides when to call host-registered tools (calculator / search / domain APIs) and weaves their results back into the chat reply.
    boundary_principles:
      - "Plug-and-play tooling: pulls in foundry-substrate-tools through the tool.invoke@v1 need; RAG and flow substrates are excluded by absence-of-need."
      - "Tool implementations are host-owned (tools' own tool.implementation?owner=host need), so the agent gains capabilities by the host registering more Spring AI ToolCallback beans — never by changing the fabric composition."
  refusals:
    - concern: tool.implementation
      rationale: The agent decides when to call tools but does not implement them; tool implementations are host-registered Spring AI ToolCallback beans.
      owned_by: urn:host
  dependencies:
    needs:
      - "agent.execute@v1"
      - "tool.invoke@v1"
  offers:
    - capability: agent.tool-using
      description: Function-calling agent surface. Hosts dispatch user messages to this capability to drive tool-augmented replies.
      consumer_access: ANY
      stability: EVOLVING
      version: 0.1.0
      metered: false
  negotiation_surface:
    endpoint: in-process:sample-tool-using-agent
    protocols_supported: [IN_PROCESS]
    supported_intents:
      - intent: confirm-tools
        description: Confirm this agent needs agent.execute and tool.invoke (tool-augmented, no retrieval).
    answer_grounding:
      - claim.offers
      - claim.dependencies
    limitations:
      - Tool-augmented only; no retrieval or workflow orchestration.
      - Tool implementations are host-registered; the agent implements none itself.
  faults:
    emitted:
      - code: agent.tool-using.failed
        category: DEPENDENCY
        severity: BLOCKING
        description: Tool-using agent failed because agent execution or required tool invocation failed.
        affects:
          needs:
            - agent.execute@v1
            - tool.invoke@v1
          offers:
            - agent.tool-using
          constraints: []
        evidence:
          signals: [INVOCATION_ERROR, POLICY_DENIAL]
        propagation:
          parent_impact: BLOCKED
          propagates_when: parent composition depends on tool-backed agent output
          suppresses_when: alternate non-tool agent path is acceptable
        remediation:
          allowed_actions: [retry_agent, repair_tool_binding, request_operator_approval]
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:sample-tool-using-agent:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
