claim:
  identity:
    uri: urn:unfurl:foundry:sample:chatbot-agent
    name: sample-chatbot-agent
    kind: INTELLIGENT_COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Minimal sample agent — single-turn chat against a host-configured chat model. The smallest meaningful Foundry assembly.
    concerns:
      - concern: agent.chatbot
        description: Single-turn or multi-turn conversational agent; no retrieval, no tool use.
    boundary_principles:
      - "Plug-and-play minimum: declares agent.execute as its only dependency; the resolver pulls in foundry-substrate-engine and nothing else."
      - "Provider-agnostic: the chat model is supplied by the host's Spring AI ChatClient bean via the engine's spring-ai.chat-client need."
  refusals:
    - concern: ai.provider.selection
      rationale: The chatbot does not select or configure an LLM provider; the chat model arrives as a host-supplied Spring AI bean through the engine.
      owned_by: urn:host
  dependencies:
    needs:
      - "agent.execute@v1"
  offers:
    - capability: agent.chatbot
      description: Conversational agent surface. Hosts dispatch user messages to this capability to get the agent's reply.
      consumer_access: ANY
      stability: EVOLVING
      version: 0.1.0
      metered: false
  negotiation_surface:
    endpoint: in-process:sample-chatbot-agent
    protocols_supported: [IN_PROCESS]
    supported_intents:
      - intent: confirm-chat-only
        description: Confirm this agent needs only agent.execute (no retrieval or tools).
    answer_grounding:
      - claim.offers
      - claim.dependencies
    limitations:
      - Single conversational surface; no retrieval or tool use.
      - The chat model is host-supplied via the engine; the agent selects no provider.
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:sample-chatbot-agent:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
