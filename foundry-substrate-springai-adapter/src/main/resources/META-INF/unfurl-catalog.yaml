claim:
  identity:
    uri: urn:unfurl:foundry:springai-adapter
    name: foundry-substrate-springai-adapter
    kind: COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Spring AI adapter for the Foundry substrate — implements ModelProvider, EmbeddingProvider, and VectorStore by wrapping host-supplied Spring AI beans.
    concerns:
      - concern: springai.model-provider
        description: Routes foundry ModelProvider calls through a Spring AI ChatModel bean.
      - concern: springai.embedding-provider
        description: Routes foundry EmbeddingProvider calls through a Spring AI EmbeddingModel bean.
      - concern: springai.vector-store
        description: Routes foundry VectorStore upsert/query through a Spring AI VectorStore bean.
    boundary_principles:
      - "Provider-agnostic by construction: the customer picks the Spring AI provider (OpenAI, Anthropic, Azure, Ollama, Bedrock, ...) by wiring their preferred starter; this adapter speaks foundry's neutral port interfaces."
      - "No design-time secrets: API keys, deployment ids, and vector-store credentials travel via the host's Spring context, never via Fabric design-time state."
      - "Plug-in, not replacement: foundry substrates that take foundry's ModelProvider / EmbeddingProvider / VectorStore ports work unchanged when this adapter is the implementation."
  refusals:
    - concern: ai.provider.implementation
      rationale: This adapter wraps Spring AI, which is itself the source of provider-specific wire formats; the adapter never speaks Anthropic / OpenAI / Azure / Ollama formats directly.
      owned_by: urn:spring:ai
  dependencies:
    needs:
      # Host-supplied Spring AI beans. Each is owner=host because the
      # customer's Spring context governs which provider/backend is
      # actually wired; fabric composition does not select among them.
      - "spring-ai.chat-client@v1?owner=host"
      - "spring-ai.embedding-client@v1?owner=host"
      - "spring-ai.vector-store@v1?owner=host"
  offers:
    - capability: springai.model-provider
      description: Foundry ModelProvider implementation backed by Spring AI ChatModel.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: EVOLVING
      version: 0.1.0
      metered: false
    - capability: springai.embedding-provider
      description: Foundry EmbeddingProvider implementation backed by Spring AI EmbeddingModel.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: EVOLVING
      version: 0.1.0
      metered: false
    - capability: springai.vector-store
      description: Foundry VectorStore implementation backed by Spring AI VectorStore.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: EVOLVING
      version: 0.1.0
      metered: false
  faults:
    emitted:
      - code: springai.model-provider.failed
        category: DEPENDENCY
        severity: BLOCKING
        description: Spring AI model provider failed or became unavailable.
        affects:
          needs: []
          offers:
            - springai.model-provider
          constraints: []
        evidence:
          signals: [HEALTH, INVOCATION_ERROR, METRIC_THRESHOLD]
        propagation:
          parent_impact: BLOCKED
          propagates_when: parent agent depends on model completion
          suppresses_when: alternate model provider binding is active
        remediation:
          allowed_actions: [retry_provider_call, switch_provider, repair_provider_binding]
      - code: springai.embedding-provider.failed
        category: DEPENDENCY
        severity: DEGRADED
        description: Spring AI embedding provider failed for embedding generation.
        affects:
          needs: []
          offers:
            - springai.embedding-provider
          constraints: []
        evidence:
          signals: [HEALTH, INVOCATION_ERROR]
        propagation:
          parent_impact: DEGRADED
          propagates_when: parent retrieval path depends on embedding generation
          suppresses_when: retrieval can use precomputed vectors
        remediation:
          allowed_actions: [retry_embedding, switch_embedding_provider]
      - code: springai.vector-store.failed
        category: DEPENDENCY
        severity: DEGRADED
        description: Spring AI vector store access failed for retrieval.
        affects:
          needs: []
          offers:
            - springai.vector-store
          constraints: []
        evidence:
          signals: [HEALTH, INVOCATION_ERROR]
        propagation:
          parent_impact: DEGRADED
          propagates_when: parent retrieval path depends on vector-store access
          suppresses_when: retrieval is optional or alternate store is active
        remediation:
          allowed_actions: [repair_vector_store_binding, switch_vector_store]
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:foundry-substrate-springai-adapter:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
