claim:
  identity:
    uri: urn:unfurl:foundry:prompt
    name: foundry-substrate-prompt
    kind: COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Deterministic prompt composition substrate for Foundry intelligent components.
    concerns:
      - concern: prompt.compose
        description: Compose a deterministic prompt from a template + structured inputs.
      - concern: prompt.template
        description: Render a registered prompt template.
    boundary_principles:
      - Deterministic composition; no model invocation.
      - Templates are inputs; the substrate does not ship customer prompts.
  refusals:
    - concern: prompt.execute
      rationale: This substrate composes prompts only; executing them against a model is the LLM advisor's responsibility.
      owned_by: urn:unfurl:advisor
  dependencies:
    needs: []
  offers:
    - capability: prompt.compose
      description: Compose a prompt from a registered template plus structured inputs.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: STABLE
      version: 0.1.0
      metered: false
    - capability: prompt.template
      description: Render a registered prompt template.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: STABLE
      version: 0.1.0
      metered: false
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:foundry-substrate-prompt:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
