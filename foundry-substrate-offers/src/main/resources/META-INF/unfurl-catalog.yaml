claim:
  identity:
    uri: urn:unfurl:foundry:offers
    name: foundry-substrate-offers
    kind: COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Canonical Foundry DCP offers and claim projectors — standard AI capability offers plus projection of foundry/flow composition into DCP claims.
    concerns:
      - concern: foundry.offers
        description: Canonical AI capability offers (agent.run, tool.call, rag.search, provider.call, skill.invoke) shared across substrates.
      - concern: foundry.claim-projection
        description: Project foundry-agent and flow-workflow composition graphs into DCP claims with containment metadata (FoundryClaimProjector / FlowClaimProjector).
    boundary_principles:
      - Capability and claim metadata only; invokes no agent, tool, or model.
      - Synthesizes DCP claims from existing domain refs; it does not execute the composition it describes.
  refusals:
    - concern: agent.execution
      rationale: Declares canonical offers and projects claims for the broker/navigator; running agents or tools is the engine's responsibility.
      owned_by: urn:unfurl:foundry:engine
  dependencies:
    needs: []
  offers:
    - capability: foundry.offers
      description: Canonical AI capability offers and the foundry/flow DCP claim projectors.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: EVOLVING
      version: 0.1.0
      metered: false
  faults:
    emitted: []
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:foundry-substrate-offers:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
