claim:
  identity:
    uri: urn:unfurl:foundry:tools
    name: foundry-substrate-tools
    kind: COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Tool-invocation substrate for Foundry intelligent components.
    concerns:
      - concern: tool.invoke
        description: Invoke a registered tool by name with structured inputs.
      - concern: tool.register
        description: Register a host-provided tool implementation.
    boundary_principles:
      - Tools are host-supplied; the substrate is a thin invocation surface.
      - Deterministic dispatch; the substrate itself performs no external I/O.
  refusals:
    - concern: tool.implementation
      rationale: The tools substrate dispatches to host-supplied tool implementations by name; it does not implement any tool itself.
      owned_by: urn:host
  dependencies:
    needs:
      - "tool.implementation@v1?owner=host"
  offers:
    - capability: tool.invoke
      description: Invoke a registered tool by name with structured inputs.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: STABLE
      version: 0.1.0
      metered: false
    - capability: tool.register
      description: Register a host-provided tool implementation.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: STABLE
      version: 0.1.0
      metered: false
  faults:
    emitted:
      - code: tool.invoke.failed
        category: CAPABILITY
        severity: DEGRADED
        description: Tool invocation failed or returned a governed failure result.
        affects:
          needs: []
          offers:
            - tool.invoke
          constraints: []
        evidence:
          signals: [INVOCATION_ERROR, POLICY_DENIAL]
        propagation:
          parent_impact: DEGRADED
          propagates_when: parent agent depends on tool invocation output
          suppresses_when: tool is optional or alternate tool path is available
        remediation:
          allowed_actions: [retry_tool, repair_tool_binding, request_operator_approval]
      - code: tool.register.failed
        category: CAPABILITY
        severity: BLOCKING
        description: Tool registration failed, leaving a declared tool unavailable to agents.
        affects:
          needs: []
          offers:
            - tool.register
          constraints: []
        evidence:
          signals: [INVOCATION_ERROR, POLICY_DENIAL]
        propagation:
          parent_impact: BLOCKED
          propagates_when: parent composition requires the registered tool
          suppresses_when: no parent claim requires this tool
        remediation:
          allowed_actions: [repair_tool_manifest, retry_registration]
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:foundry-substrate-tools:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
