claim:
  identity:
    uri: urn:unfurl:foundry:ports
    name: foundry-substrate-ports
    kind: COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Foundry substrate port contracts — neutral interfaces (AgentRuntime, ToolExecutor, ModelProvider, RagRetriever, registries) implemented by adapters and consumed by the engine.
    concerns:
      - concern: foundry.ports
        description: Implementation-free port interfaces defining the substrate's hexagonal boundary.
    boundary_principles:
      - Interfaces only; carries no concrete implementation.
      - Adapters bind concrete providers/executors; the ports stay implementation-free (Ports & Adapters).
  refusals:
    - concern: port.implementation
      rationale: Declares port interfaces only; concrete implementations live in adapters such as the Spring AI adapter.
      owned_by: urn:unfurl:foundry:springai-adapter
  dependencies:
    needs: []
  offers:
    - capability: foundry.ports
      description: The neutral port interfaces (runtime, tool, model, RAG, registries) of the Foundry substrate.
      consumer_access: NAMED_COMPONENTS_ONLY
      stability: STABLE
      version: 0.1.0
      metered: false
  faults:
    emitted: []
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:foundry-substrate-ports:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
