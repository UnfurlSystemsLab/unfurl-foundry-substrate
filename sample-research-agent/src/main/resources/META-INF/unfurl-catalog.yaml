claim:
  identity:
    uri: urn:unfurl:foundry:sample:research-agent
    name: sample-research-agent
    kind: INTELLIGENT_COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Retrieval-augmented sample agent — answers from a host-supplied vector corpus by combining the chat model with rag.search.
    concerns:
      - concern: agent.research
        description: Answer questions by retrieving relevant passages from a vector corpus and grounding the chat reply in them.
    boundaryPrinciples:
      - "Plug-and-play retrieval: pulls in foundry-substrate-rag through the rag.search@v1 need; tools and flow substrates are excluded by absence-of-need."
      - "The corpus and embedding model are host-owned (rag's own ?owner=host needs), so the customer's Spring AI context governs provider selection."
  refusals: []
  dependencies:
    needs:
      - "agent.execute@v1"
      - "rag.search@v1"
  offers:
    - capability: agent.research
      description: Retrieval-grounded conversational agent. Hosts pass research questions to this capability.
      consumerAccess: ANY
      stability: EVOLVING
      version: 0.1.0
      metered: false
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:sample-research-agent:0.1.0
    packaging: jar
    source: catalog
  binding:
    defaultMode: IN_PROCESS
    supportedModes: [IN_PROCESS]
  componentShapeProfile:
    defaultShape: IN_PROCESS_LIBRARY
    supportedShapes: [IN_PROCESS_LIBRARY]
    shapeRuntime: {}
