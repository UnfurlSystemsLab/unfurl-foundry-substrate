claim:
  identity:
    uri: urn:unfurl:foundry:engine
    name: foundry-substrate-engine
    kind: INTELLIGENT_COMPONENT
    version: 0.1.0
    publisher: Unfurl
  domain:
    summary: Model-agnostic agent orchestration runtime; the entry point for plug-and-play Foundry agents.
    concerns:
      - concern: agent.execute
        description: Execute an agent's reasoning loop against a host-supplied ModelProvider port, optionally enriched with substrate plugins (RAG / tools / prompt templates) that the agent declares as needs.
    boundary_principles:
      - "Plug-and-play composition: the engine itself only needs a ModelProvider port; RAG and tools substrates are pulled in only when the agent's own needs request them."
      - "Model-agnostic by construction: the engine consumes foundry's neutral ModelProvider interface, so the LLM provider is selected by an adapter or profile binding rather than by engine code."
      - "Customer-controlled secrets: API keys and host configuration travel via provider adapters or runtime bindings, never via Fabric design-time state."
  refusals:
    - concern: ai.provider.implementation
      rationale: The engine delegates provider-specific HTTP / SDK calls to a ModelProvider adapter; it does not implement Anthropic / OpenAI / Azure / Ollama wire formats itself.
      owned_by: urn:unfurl:foundry:provider-adapter
  dependencies:
    needs:
      - "model-provider@v1?transport=profile-binding&shape=com.unfurl.foundry.substrate.ports.ModelProvider"
  offers:
    - capability: agent.execute
      description: Run an agent's reasoning loop; substrate plugins are discovered via the assembly composition, not via runtime configuration.
      consumer_access: ANY
      stability: EVOLVING
      version: 0.1.0
      metered: false
  negotiation_surface:
    endpoint: in-process:foundry-substrate-engine
    protocols_supported: [IN_PROCESS]
    supported_intents:
      - intent: bind-model-provider
        description: Confirm the host supplies a ModelProvider binding for agent execution.
      - intent: declare-substrate-plugins
        description: Declare which RAG / tool / prompt substrates the agent's needs pull in.
    answer_grounding:
      - claim.offers
      - claim.dependencies
    limitations:
      - The engine requires a ModelProvider binding; it selects no LLM provider itself.
      - Substrate plugins are composed from the agent's declared needs, not from runtime configuration.
  faults:
    emitted:
      - code: agent.execute.failed
        category: RUNTIME
        severity: BLOCKING
        description: Agent execution failed before producing a governed result.
        affects:
          needs:
            - model-provider@v1?transport=profile-binding&shape=com.unfurl.foundry.substrate.ports.ModelProvider
          offers:
            - agent.execute
          constraints: []
        evidence:
          signals: [INVOCATION_ERROR, METRIC_THRESHOLD]
        propagation:
          parent_impact: BLOCKED
          propagates_when: parent composition depends on agent.execute output
          suppresses_when: alternate agent runtime is available
        remediation:
          allowed_actions: [retry_agent, repair_model_provider_binding, inspect_agent_state]
  metadata:
    dcp_version: "0.2.0"
    claim_version: "0.1.0"
    created_at: "1970-01-01T00:00:00Z"
catalog:
  lifecycle:
    status: ACTIVE
  artifact:
    coordinates: com.unfurl.foundry.substrate:foundry-substrate-engine:0.1.0
    packaging: jar
    source: catalog
  binding:
    default_mode: IN_PROCESS
    supported_modes: [IN_PROCESS]
  component_shape_profile:
    default_shape: IN_PROCESS_LIBRARY
    supported_shapes: [IN_PROCESS_LIBRARY]
    shape_runtime: {}
