name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unfurl-foundry-substrate
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: MAVEN_GITHUB_USER
          server-password: MAVEN_GITHUB_TOKEN

      - name: Verify unfurl-foundry-substrate
        env:
          MAVEN_GITHUB_USER: ${{ github.actor }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.CI_REPO_TOKEN != '' && secrets.CI_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress --update-snapshots verify

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')))

    steps:
      - name: Checkout unfurl-foundry-substrate
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: MAVEN_GITHUB_USER
          server-password: MAVEN_GITHUB_TOKEN

      - name: Deploy unfurl-foundry-substrate to GitHub Packages
        env:
          MAVEN_GITHUB_USER: ${{ github.actor }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.CI_REPO_TOKEN != '' && secrets.CI_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress
          -DskipTests
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/unfurlsystemslab/unfurl
          deploy
