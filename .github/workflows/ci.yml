name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      substrate-repository:
        description: GitHub repository for unfurl-substrate
        required: false
        default: ''
      substrate-ref:
        description: Branch, tag, or SHA for unfurl-substrate
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unfurl-foundry-substrate
        uses: actions/checkout@v4
        with:
          path: unfurl-foundry-substrate

      - name: Checkout unfurl-substrate
        if: ${{ inputs.substrate-ref == '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.substrate-repository || format('{0}/unfurl-substrate', github.repository_owner) }}
          path: unfurl-substrate

      - name: Checkout unfurl-substrate at requested ref
        if: ${{ inputs.substrate-ref != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.substrate-repository || format('{0}/unfurl-substrate', github.repository_owner) }}
          ref: ${{ inputs.substrate-ref }}
          path: unfurl-substrate

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install unfurl-substrate locally
        working-directory: unfurl-substrate
        run: mvn --batch-mode --no-transfer-progress -DskipTests install

      - name: Verify unfurl-foundry-substrate
        working-directory: unfurl-foundry-substrate
        run: mvn --batch-mode --update-snapshots verify

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout unfurl-foundry-substrate
        uses: actions/checkout@v4
        with:
          path: unfurl-foundry-substrate

      - name: Checkout unfurl-substrate
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/unfurl-substrate', github.repository_owner) }}
          path: unfurl-substrate

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install unfurl-substrate locally
        working-directory: unfurl-substrate
        run: mvn --batch-mode --no-transfer-progress -DskipTests install

      - name: Deploy unfurl-foundry-substrate to GitHub Packages
        working-directory: unfurl-foundry-substrate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress
          -DskipTests
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
          deploy
